[project]
name = "patobase"
version = "0.1.0"
description = "Consultas SQL y dashboards al estilo Metabase con DuckDB, htmx y Alpine.js"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "duckdb>=1.3",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "pytz>=2026.6",
]

[project.scripts]
patobase = "patobase.main:run"

# Dependencias de desarrollo (PEP 735): `uv sync` las instala por defecto
[dependency-groups]
dev = [
    "pytest>=8",
    "httpx>=0.27",
    "ruff>=0.6",
]

[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"

[tool.uv.build-backend]
# El paquete está en ./patobase (sin carpeta src/)
module-root = ""

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]  # del largo de línea se encarga `ruff format`
