[project]
name = "patobase"
version = "0.1.0"
description = "Consultas SQL y dashboards al estilo Metabase con DuckDB, htmx y Alpine.js"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "duckdb>=1.3",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
patobase = "patobase.main:run"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["patobase*"]

[tool.setuptools.package-data]
patobase = ["templates/**/*", "static/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
