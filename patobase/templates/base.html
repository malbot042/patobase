<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}patobase{% endblock %} · patobase</title>
  <link rel="icon" href="{{ url_for('static', path='favicon.svg') }}" type="image/svg+xml">
  <link rel="stylesheet" href="{{ url_for('static', path='vendor/codemirror/codemirror.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', path='vendor/codemirror/show-hint.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', path='app.css') }}">
  <script src="{{ url_for('static', path='vendor/htmx.min.js') }}" defer></script>
  <script src="{{ url_for('static', path='vendor/vega.min.js') }}" defer></script>
  <script src="{{ url_for('static', path='vendor/vega-lite.min.js') }}" defer></script>
  <script src="{{ url_for('static', path='vendor/vega-embed.min.js') }}" defer></script>
  {% block head %}{% endblock %}
  <script src="{{ url_for('static', path='app.js') }}" defer></script>
  <script src="{{ url_for('static', path='vendor/alpine.min.js') }}" defer></script>
</head>
<body hx-boost="false">
  <header class="topbar">
    <a href="/" class="brand">
      <img src="{{ url_for('static', path='favicon.svg') }}" alt="" width="22" height="22">
      <span>patobase</span>
    </a>
    <nav>
      <a href="/" class="{% if request.url.path == '/' %}active{% endif %}">Nueva consulta</a>
      <a href="/questions" class="{% if request.url.path.startswith('/questions') %}active{% endif %}">Preguntas</a>
      <a href="/dashboards" class="{% if request.url.path.startswith('/dashboards') %}active{% endif %}">Dashboards</a>
    </nav>
  </header>
  <main class="{% block main_class %}page{% endblock %}">
    {% block content %}{% endblock %}
  </main>
  <div id="toast" class="toast-area" aria-live="polite"></div>
</body>
</html>
