{% for card in cards %}
<article class="card {{ 'wide' if card.width == 2 }}" id="card-{{ card.id }}" x-data="{ wide: {{ 'true' if card.width == 2 else 'false' }} }" :class="{ wide }">
  <header class="card-head">
    <a href="/?q={{ card.question.id }}" class="card-title">{{ card.question.name }}</a>
    <div class="card-actions" x-show="$store.dash.editing" x-cloak>
      <button type="button" class="icon-btn" title="Cambiar anchura"
              @click="wide = !wide; patobase.post('/cards/{{ card.id }}/width', { width: wide ? 2 : 1 });
                      $nextTick(() => window.dispatchEvent(new Event('resize')))">⇔</button>
      <button type="button" class="icon-btn danger" title="Quitar del dashboard"
              hx-post="/cards/{{ card.id }}/delete" hx-target="#card-{{ card.id }}" hx-swap="outerHTML"
              hx-confirm="¿Quitar «{{ card.question.name }}» del dashboard?">✕</button>
    </div>
  </header>
  <div class="card-body"
       hx-get="/questions/{{ card.question.id }}/card"
       hx-trigger="load, dash-refresh from:body"
       hx-swap="innerHTML">
    <div class="loading"><span class="spinner"></span></div>
  </div>
</article>
{% else %}
<div class="empty wide">
  <p>Este dashboard está vacío.</p>
  <p class="muted small">Añade preguntas guardadas con el selector de arriba.</p>
</div>
{% endfor %}
